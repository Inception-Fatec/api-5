spring:
  application:
    name: tecsys-motor

  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

server:
  port: ${MOTOR_PORT:8082}
  address: ${MOTOR_BIND_ADDRESS:127.0.0.1}

app:
  elevation:
    obstruction-tolerance-meters: ${OBSTRUCTION_TOLERANCE_METERS:1.5}
    los-samples: ${LOS_SAMPLES:5}
    opentopography:
      globaldem-url: ${OPENTOPOGRAPHY_GLOBALDEM_URL:https://portal.opentopography.org/API/globaldem}
      point-url: ${OPENTOPOGRAPHY_URL:https://portal.opentopography.org/API/v1/elevation}
      api-key: ${OPENTOPOGRAPHY_API_KEY:}
      dataset: ${OPENTOPOGRAPHY_DATASET:COP30}
    open-elevation:
      url: ${OPEN_ELEVATION_URL:https://api.open-elevation.com/api/v1/lookup}
