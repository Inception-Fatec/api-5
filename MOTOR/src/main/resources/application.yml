spring:
  application:
    name: tecsys-motor

  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

server:
  port: ${MOTOR_PORT:8082}
  address: ${MOTOR_BIND_ADDRESS:127.0.0.1}

app:
  # Motor de decisão. MOTOR_PROFILE escolhe a base (tecsys | compat-preciso | compat) e qualquer
  # variável abaixo, se preenchida, sobrescreve o valor do perfil. Vazia = valor do perfil.
  motor:
    profile: ${MOTOR_PROFILE:tecsys}
    threads: ${MOTOR_THREADS:0}                      # 0 = nº de núcleos − 1
    fixed-range-m: ${MOTOR_FIXED_RANGE_M:}           # alcance fixo (compat: 4000); 0 = usa o orçamento de enlace
    frequency-mhz: ${MOTOR_FREQUENCY_MHZ:}           # tecsys: 915
    tx-power-dbm: ${MOTOR_TX_POWER_DBM:}             # tecsys: 21
    sensitivity-dbm: ${MOTOR_SENSITIVITY_DBM:}       # tecsys: -120
    antenna-gains-db: ${MOTOR_ANTENNA_GAINS_DB:}     # tecsys: 0
    extra-loss-db: ${MOTOR_EXTRA_LOSS_DB:}           # vegetação/obstáculos; tecsys: 0
    max-range-m: ${MOTOR_MAX_RANGE_M:}               # teto opcional de alcance
    bdgd-heights: ${MOTOR_BDGD_HEIGHTS:}             # true = alturas por tipo de estrutura da BDGD
    gateway-height-m: ${MOTOR_GATEWAY_HEIGHT_M:}     # tecsys: 6
    sensor-height-m: ${MOTOR_SENSOR_HEIGHT_M:}       # tecsys: 5
    line-of-sight: ${MOTOR_LINE_OF_SIGHT:}           # RAYS | PROFILE | TEAM
    los-step-m: ${MOTOR_LOS_STEP_M:}                 # tecsys: 30 (resolução do Copernicus GLO-30)
    team-samples: ${MOTOR_TEAM_SAMPLES:}
    obstruction-tolerance-m: ${MOTOR_OBSTRUCTION_TOLERANCE_M:}
    earth-curvature: ${MOTOR_EARTH_CURVATURE:}
    refraction-k: ${MOTOR_REFRACTION_K:}             # tecsys: 4/3
    fresnel-fraction: ${MOTOR_FRESNEL_FRACTION:}     # 0 = linha direta; 0.6 = projeto conservador
    neighbor-candidates: ${MOTOR_NEIGHBOR_CANDIDATES:}
    bairro-like-map: ${MOTOR_BAIRRO_LIKE_MAP:}
    local-search: ${MOTOR_LOCAL_SEARCH:}
    exact-seconds: ${MOTOR_EXACT_SECONDS:}           # tempo do solver exato; 0 = desliga (tecsys: 180)
    use-terrain: ${MOTOR_USE_TERRAIN:}               # false = terreno plano (só para teste)

  terrain:
    cache-dir: ${DEM_CACHE_DIR:cache/dem}
    mirror-dir: ${DEM_MIRROR_DIR:}
    download-attempts: ${DEM_DOWNLOAD_ATTEMPTS:4}
    retry-backoff-ms: ${DEM_RETRY_BACKOFF_MS:5000}
    aws:
      base-url: ${DEM_AWS_BASE_URL:https://copernicus-dem-30m.s3.amazonaws.com}
