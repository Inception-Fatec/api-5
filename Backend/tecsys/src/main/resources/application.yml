
server:
  port: ${BACKEND_PORT:8081}

springdoc:
  show-hateoas: false

spring:
  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true

motor:
  base-url: ${MOTOR_BASE_URL:http://127.0.0.1:8082}
