
server:
  port: ${BACKEND_PORT:8081}

springdoc:
  show-hateoas: false

spring:
  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      # Tempo máximo esperando resposta do banco (s). Sem ele, se o Postgres
      # cai no meio de uma consulta (o Supabase gratuito reinicia sob carga),
      # a thread espera para sempre, segura a conexão e, com as 8 presas,
      # todo pedido vira erro 500 até reiniciar o backend. 150 s fica acima
      # do statement_timeout de 120 s do Supabase: só corta conexão morta.
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_S:150}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB

# Fica na raiz (não dentro de spring:) para o EtlRunner ler via @Value("${etl.*}").
etl:
  python-executable: ${ETL_PYTHON:python}
  script-path: ${ETL_SCRIPT_PATH:../api-5/modules/etl_cli.py}
  timeout-minutes: ${ETL_TIMEOUT_MINUTES:120}

# URL do motor de decisão. Lida pelo DecisionEngineClient; nos scripts e no
# docker-compose vem da variável ENGINE_URL.
engine:
  url: ${ENGINE_URL:http://localhost:8082/api/calculate}
