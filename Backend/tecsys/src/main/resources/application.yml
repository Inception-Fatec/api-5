
server:
  port: ${BACKEND_PORT:8081}

springdoc:
  show-hateoas: false

spring:
  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB

# Fica na raiz (não dentro de spring:) para o EtlRunner ler via @Value("${etl.*}").
etl:
  python-executable: ${ETL_PYTHON:python}
  script-path: ${ETL_SCRIPT_PATH:../api-5/modules/etl_cli.py}
  timeout-minutes: ${ETL_TIMEOUT_MINUTES:120}

motor:
  base-url: ${MOTOR_BASE_URL:http://127.0.0.1:8082}
