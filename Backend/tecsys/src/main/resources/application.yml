server:
  port: 8081

springdoc:
  show-hateoas: false

spring:
  config:
    import: optional:file:.env.properties
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
  etl:
    python-executable: python
    script-path: ../api-5/modules/etl_cli.py
    timeout-minutes: 120