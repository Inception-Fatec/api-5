# Alternativa "sobe tudo de uma vez". Os scripts em scripts/ continuam sendo o
# jeito principal (cada serviço sobe e para sozinho).
#
#   docker compose up --build        # db + backend + motor + frontend
#   docker compose up --build db     # só um serviço
#   docker compose ps                # estado e saúde (healthy) de cada serviço
#   docker compose logs -f motor     # acompanha o log de um serviço
#   docker compose down              # para tudo (volumes tecsys-pgdata e tecsys-dem-cache preservados)
#   docker compose down -v           # CUIDADO: apaga também os caches tecsys-dem-cache e tecsys-aneel-cache
#
# Endereços após a subida:
#   frontend  http://localhost:8080
#   backend   http://localhost:8081  (Swagger em /swagger-ui.html)
#   motor     http://127.0.0.1:8082  (sem autenticação; só acessível pela própria máquina)
#   banco     localhost:5433         (tecsys / tecsys)
#
# Segredo do JWT (obrigatório, #TG-94): vem do ambiente ou do arquivo .env na
# raiz do repositório (gitignored), por exemplo:
#   API_SECURITY_TOKEN_SECRET=<saída de: openssl rand -hex 32>
# Relevo do motor: Copernicus GLO-30 baixado da AWS, sem chave (#TG-139). Os
# tiles ficam no volume tecsys-dem-cache, o mesmo do scripts/run-motor.sh.
#
# Banco local (PostGIS 17). O banco do compose nasce vazio: para carregar a
# rede do dump, suba o db e rode ./scripts/run-db.sh (ver scripts/README.md).
# Para usar o Supabase no backend, suba o backend pelo script
# (./scripts/run-backend.sh --db supabase) em vez de pelo compose.
name: tecsys

services:
  db:
    image: postgis/postgis:17-3.6-alpine
    container_name: tecsys-postgis
    environment:
      POSTGRES_USER: tecsys
      POSTGRES_PASSWORD: tecsys
      POSTGRES_DB: tecsys
    ports:
      - "5433:5432"
    volumes:
      - tecsys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecsys"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./Backend/tecsys
      # Scripts Python do ETL (modules/) entram na imagem do backend (#TG-103).
      additional_contexts:
        modules: ./modules
    container_name: tecsys-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/tecsys
      DB_USER: tecsys
      DB_PASSWORD: tecsys
      API_SECURITY_TOKEN_SECRET: "${API_SECURITY_TOKEN_SECRET:?Defina API_SECURITY_TOKEN_SECRET}"
      # Dentro do container, localhost é o próprio backend: o motor é
      # chamado pelo nome do serviço na rede do compose.
      ENGINE_URL: http://motor:8082/api/calculate
      # Banco onde o ETL (Python, dentro do container) grava os dados da rede.
      ETL_DB_URL: postgresql+psycopg2://tecsys:tecsys@db:5432/tecsys
    ports:
      - "8081:8081"
    volumes:
      - tecsys-aneel-cache:/var/cache/tecsys-aneel
    depends_on:
      db:
        condition: service_healthy
    # Porta aberta = Spring subiu (as migrations do Flyway rodam antes disso).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  motor:
    build: ./MOTOR
    container_name: tecsys-motor
    environment:
      DB_URL: jdbc:postgresql://db:5432/tecsys
      DB_USER: tecsys
      DB_PASSWORD: tecsys
      # Escuta em todas as interfaces do container para o backend alcançar;
      # no host, a porta só é publicada em 127.0.0.1 (o motor não tem login).
      MOTOR_BIND_ADDRESS: 0.0.0.0
      # Ajustes opcionais (valor vazio mantém o do perfil). Lista completa em MOTOR/README.md.
      # MOTOR_PROFILE: tecsys            # tecsys | compat-preciso | compat
      # MOTOR_EXACT_SECONDS: "180"       # tempo do solver exato (0 = só heurística)
      # Mirror local/NAS do relevo (opcional): descomente também o volume abaixo.
      # DEM_MIRROR_DIR: /var/cache/tecsys-dem-mirror
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - tecsys-dem-cache:/var/cache/tecsys-dem
      # - /mnt/tecsys-dem-mirror:/var/cache/tecsys-dem-mirror:ro
    # O motor só consulta o banco sob demanda (chamado pelo backend), que é
    # quem roda as migrações Flyway (project_coverage) no startup.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      args:
        # A URL da API é embutida no build: trocar estes valores exige --build.
        API_HOST: localhost
        API_PORT: "8081"
    container_name: tecsys-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  tecsys-pgdata:
  tecsys-aneel-cache:
    # CSVs da ANEEL baixados pelo ETL; nome fixo, compartilhado com o run-backend.sh.
    name: tecsys-aneel-cache
  tecsys-dem-cache:
    # Nome fixo para compartilhar o cache do relevo com o scripts/run-motor.sh.
    name: tecsys-dem-cache
